<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio — Planning de contenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F3EC; --ink:#2A2430; --ink-soft:#5A5262; --muted:#8A8290;
  --chrome:#2E2733; --chrome-2:#3C3345; --line:#E7E0D5; --card:#FFFFFF;
  --accent:#B5698A; --accent-d:#9A4F72; --sage:#7E8A6B;
  --story:#C56B7A; --story-bg:#F7E4E9; --post:#3E6DA3; --post-bg:#E1EBF6; --reel:#B8863B; --reel-bg:#F6ECD6;
  --shadow:0 8px 30px rgba(42,36,48,.10); --shadow-s:0 2px 10px rgba(42,36,48,.07);
  --r:18px; --r-s:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#EDE7DC;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  line-height:1.5;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.12);display:flex;flex-direction:column}
@media(min-width:520px){body{padding:22px 0}.app{min-height:calc(100vh - 44px);border-radius:26px;overflow:hidden}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{margin:0;font-family:Fraunces,serif;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.mono{font-family:'Space Mono',monospace}

/* header */
header{position:sticky;top:0;z-index:40;background:linear-gradient(160deg,var(--chrome),var(--chrome-2));
  color:#F3EEE7;padding:16px 20px 14px;padding-top:max(16px,env(safe-area-inset-top))}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(181,105,138,.55);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(181,105,138,.5)}70%{box-shadow:0 0 0 10px rgba(181,105,138,0)}100%{box-shadow:0 0 0 0 rgba(181,105,138,0)}}
.brand b{font-family:Fraunces;font-weight:600;font-size:18px;letter-spacing:.02em}
.brand span{font-size:11px;color:#B9AFC4;letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:-2px}
.today-chip{text-align:right;font-size:12px;color:#CFC6D8}
.today-chip b{display:block;font-family:'Space Mono',monospace;font-size:13px;color:#fff;letter-spacing:.02em}

/* views */
main{flex:1;padding:20px 18px 96px}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* section titles */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 2px 10px}
.sec{margin-bottom:26px}

/* hero next-post */
.hero{background:linear-gradient(155deg,#332B3C,#4A3F55);color:#F5F1EA;border-radius:var(--r);padding:22px 20px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(181,105,138,.35),transparent 70%)}
.hero .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C9BFD4;display:flex;align-items:center;gap:8px}
.count{font-family:Fraunces;font-weight:600;font-size:44px;line-height:1;margin:8px 0 2px;letter-spacing:-.02em}
.count small{font-size:20px;color:#D9CFE0;font-weight:500}
.hero .when{font-family:'Space Mono',monospace;font-size:13px;color:#E7B9CE}
.hero-body{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.13)}
.hero-line{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:6px;color:#EDE7F0}
.hero-line .ic{opacity:.8;flex:none}
.hero-scene{font-size:13px;color:#CDC4D6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:10px;margin-top:16px}
.btn{border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;flex:1;box-shadow:0 6px 16px rgba(181,105,138,.35)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:rgba(255,255,255,.12);color:#F3EEE7;flex:1}
.btn-ghost:hover{background:rgba(255,255,255,.2)}

/* type chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:4px 9px;border-radius:999px;text-transform:uppercase}
.chip.story{background:var(--story-bg);color:var(--story)}
.chip.post{background:var(--post-bg);color:var(--post)}
.chip.reel{background:var(--reel-bg);color:var(--reel)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}

/* today timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:13px 14px;display:flex;
  align-items:center;gap:12px;text-align:left;width:100%;transition:transform .12s,box-shadow .15s,border-color .15s}
.slot:hover{box-shadow:var(--shadow-s);border-color:#DED6C8;transform:translateY(-1px)}
.slot .time{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--ink);width:46px;flex:none}
.slot .mid{flex:1;min-width:0}
.slot .mid .top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.slot .mid .lieu{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .cap{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.done{opacity:.5}
.slot.next{border-color:var(--accent);box-shadow:0 0 0 2px rgba(181,105,138,.16)}
.slot .chev{color:var(--muted);flex:none}

/* mini month card */
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-s)}
.mini-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mini-head b{font-family:Fraunces;font-size:16px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:10px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px;letter-spacing:.04em}
.cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:12.5px;color:var(--ink);position:relative;transition:background .15s}
.cell.day{cursor:pointer}
.cell.day:hover{background:#F1EAdf}
.cell.empty{visibility:hidden}
.cell.today{background:var(--accent);color:#fff;font-weight:700}
.cell.today .dots i{background:#fff!important}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:4px;height:4px;border-radius:50%}
.dots .s{background:var(--story)}.dots .p{background:var(--post)}.dots .r{background:var(--reel)}

/* calendar view big */
.cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.cal-head h1{font-size:26px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:2px 2px 16px}
.legend span{font-size:11px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .cell{aspect-ratio:.9;border:1px solid var(--line);background:var(--card);border-radius:11px;justify-content:flex-start;padding-top:7px}
.cal-grid .cell.day:hover{border-color:var(--accent);background:#fff}
.cal-grid .cell.today{background:var(--accent);border-color:var(--accent)}
.cal-grid .cell .num{font-weight:600}

/* day view */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:14px}
.day-hero{margin-bottom:18px}
.day-hero .dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-d);font-weight:700}
.day-hero h1{font-size:28px;margin:4px 0 2px;text-transform:capitalize}
.day-hero .th{color:var(--ink-soft);font-size:14px}
.resume{background:linear-gradient(150deg,#F0E9DE,#F7F3EC);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:20px;font-size:13.5px;color:var(--ink-soft)}
.resume .k{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}

/* detail sheet */
.overlay{position:fixed;inset:0;background:rgba(30,25,34,.5);backdrop-filter:blur(3px);z-index:80;opacity:0;
  pointer-events:none;transition:opacity .28s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:480px;z-index:90;
  background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);
  max-height:92vh;display:flex;flex-direction:column;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translateX(-50%) translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:#D8D0C4;margin:10px auto 4px}
.sheet-head{padding:6px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet-head .time{font-family:'Space Mono',monospace;font-weight:700;font-size:15px}
.sheet-head .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#EDE6DA;display:grid;place-items:center;color:var(--ink-soft)}
.sheet-body{overflow-y:auto;padding:16px 20px 30px;-webkit-overflow-scrolling:touch}
.field{margin-bottom:18px}
.field>.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.lieu-box{background:#EFE9DF;border-radius:12px;padding:12px 13px;font-size:13px;color:var(--ink-soft)}
.lieu-box b{color:var(--ink);display:block;margin-bottom:3px;font-size:13.5px}
.prompt-box{background:var(--chrome);color:#EDE7DF;border-radius:14px;padding:15px;font-size:12.5px;line-height:1.6;
  white-space:pre-wrap;font-family:'Space Mono',monospace;max-height:280px;overflow-y:auto}
.copybtn{margin-top:10px;width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:14px;font-weight:700;
  font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 6px 16px rgba(181,105,138,.32)}
.copybtn:active{transform:scale(.98)}
.copybtn.ok{background:var(--sage);box-shadow:none}
.mini-copy{background:#EDE6DA;color:var(--ink-soft);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.mini-copy.ok{background:#E3EAD8;color:var(--sage)}
.txt-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:13.5px;color:var(--ink)}
.hashtags{color:var(--post);font-size:12.5px;line-height:1.7;word-break:break-word}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px;overflow:hidden}
summary{padding:12px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
details[open] summary{border-bottom:1px solid var(--line)}
details .inner{padding:12px 14px}
.pref{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px}
.pref.rec{background:var(--reel-bg);color:var(--reel)}
.pref.no{background:#E9EDE3;color:var(--sage)}

/* bottom nav */
nav{position:sticky;bottom:0;z-index:50;background:rgba(247,243,236,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;color:var(--muted);font-size:11px;font-weight:600}
.navbtn.active{color:var(--accent)}
.navbtn svg{width:22px;height:22px}

/* toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:120;opacity:0;pointer-events:none;
  transition:all .3s;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brandrow">
      <div class="brand">
        <span class="dot"></span>
        <div><b>Studio</b><span>Content planner</span></div>
      </div>
      <div class="today-chip" id="todayChip"><span>Aujourd'hui</span><b id="todayDate">—</b></div>
    </div>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section class="view active" id="view-dashboard">
      <div class="sec">
        <div class="eyebrow">Prochain contenu</div>
        <div class="hero" id="heroNext"></div>
      </div>
      <div class="sec">
        <div class="eyebrow" id="todayLabel">Aujourd'hui</div>
        <div class="tl" id="todayTl"></div>
      </div>
      <div class="sec">
        <div class="eyebrow">Ce mois-ci</div>
        <div class="mini" id="miniCal"></div>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="view-calendar">
      <div class="cal-head"><h1 id="calTitle">Juillet 2026</h1></div>
      <div class="legend">
        <span><i style="background:var(--story)"></i>Story</span>
        <span><i style="background:var(--post)"></i>Post</span>
        <span><i style="background:var(--reel)"></i>Reel</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <!-- DAY -->
    <section class="view" id="view-day">
      <button class="back" onclick="go('calendar')">‹ Calendrier</button>
      <div class="day-hero" id="dayHero"></div>
      <div class="resume" id="dayResume"></div>
      <div class="eyebrow">Programme de la journée</div>
      <div class="tl" id="dayTl"></div>
    </section>
  </main>

  <nav>
    <button class="navbtn active" id="nav-dashboard" onclick="go('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Tableau de bord</button>
    <button class="navbtn" id="nav-calendar" onclick="go('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Calendrier</button>
  </nav>
</div>

<!-- detail sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab"></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"month": "Juillet 2026", "monthIndex": 6, "year": 2026, "firstWeekday": 2, "daysInMonth": 31, "days": [{"day": 1, "date": "2026-07-01", "weekday": "Mercredi", "wd": 2, "theme": "Journée courses + rendez-vous", "resume": "Réveil vers 07h45. Réveil, courses en ville, rendez-vous personnel (coiffeur/institut), pause café, retour à la maison en fin d'après-midi. Tenue du jour : robe légère fleurie. Lieu principal évoqué en contenu : une place historique avec une fontaine.", "items": [{"time": "08h00", "type": "Story (photo)", "typeKey": "story", "duree": "2s", "lieu": "🏠 Cuisine (appartement)", "lieuDetail": "Cuisine ouverte de l'appartement parisien : meubles blanc mat/bois clair, plan de travail en pierre claire, crédence zellige beige, robinet laiton, étagères ouvertes, plantes aromatiques, machine à café, table bois clair, parquet chêne, moulures. Lumière du matin douce.", "promptBase": "Same woman, same exact face, wavy light brown hair with golden highlights, clear blue-grey eyes, tanned skin, natural facial features consistent with reference. Plan rapproché en train de se coiffer/maquiller dans la cuisine de son appartement, ambiance matinale douce, lumière naturelle. REALISME PHOTO: rendu 100% photoréaliste, texture de peau naturelle avec pores et micro-imperfections visibles, aucun effet lissé/plastique typique de l'IA, grain photographique naturel léger, éclairage cohérent avec la scène et les ombres portées, netteté type photo DSLR (profondeur de champ naturelle), mains et doigts anatomiquement corrects, reflets naturels dans les yeux, 4K, haute définition. Format vertical 9:16 plein écran (story).", "promptFinal": "Same woman, same exact face across every image, wavy light brown hair with subtle golden highlights, clear blue-grey eyes, warm lightly tanned skin, natural balanced facial features, silhouette élancée et légèrement athlétique, âge apparent 24-27 ans, identique à l'image de référence uploadée.\n\nSCÈNE : Plan rapproché en train de se const JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const byDate={}; DATA.days.forEach(d=>byDate[d.date]=d);
// map real JS getDay (0=Sun) to our wd (0=Mon)
function jsWd(dt){return (dt.getDay()+6)%7;}
function parseTime(t){const m=/(\d{1,2})h(\d{2})/.exec(t);return m?[+m[1],+m[2]]:null;}
function itemsOnly(day){return day.items.filter(i=>i.typeKey!=='resume'&&parseTime(i.time));}
function chipHTML(k){const lab={story:'Story',post:'Post',reel:'Reel'}[k]||k;return `<span class="chip ${k}"><span class="d"></span>${lab}</span>`;}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---- today resolution (evergreen: real weekday) ---- */
function resolveToday(){
  const now=new Date();
  const iso=now.toISOString().slice(0,10);
  if(byDate[iso]) return {day:byDate[iso],now};
  const wd=jsWd(now);
  // pick the dataset day matching weekday, closest day-of-month
  let cand=DATA.days.filter(d=>d.wd===wd);
  if(!cand.length) cand=DATA.days;
  cand.sort((a,b)=>Math.abs(a.day-now.getDate())-Math.abs(b.day-now.getDate()));
  return {day:cand[0],now};
}
function nextDayRoutine(now){
  const nwd=jsWd(new Date(now.getTime()+864e5));
  let c=DATA.days.filter(d=>d.wd===nwd); return c.length?c[0]:DATA.days[0];
}

/* ---- dashboard ---- */
function renderDashboard(){
  const {day,now}=resolveToday();
  document.getElementById('todayDate').textContent=`${JOURS[jsWd(now)].slice(0,3)} ${now.getDate()} ${MOIS[now.getMonth()].slice(0,4)}.`;
  const items=itemsOnly(day);
  // find next upcoming today
  const nowM=now.getHours()*60+now.getMinutes();
  let next=null, nextDate=null, tomorrow=false;
  for(const it of items){const[h,m]=parseTime(it.time);if(h*60+m>=nowM){next=it;nextDate=new Date(now);nextDate.setHours(h,m,0,0);break;}}
  if(!next){const nd=nextDayRoutine(now);const ni=itemsOnly(nd);if(ni.length){next=ni[0];const[h,m]=parseTime(next.time);nextDate=new Date(now.getTime()+864e5);nextDate.setHours(h,m,0,0);tomorrow=true;}}
  window._heroNext={day,it:next,date:nextDate};
  renderHero(next,nextDate,tomorrow,day);
  // today timeline
  document.getElementById('todayLabel').textContent = `Aujourd'hui · ${day.theme}`;
  const tl=document.getElementById('todayTl');tl.innerHTML='';
  items.forEach(it=>{
    const[h,m]=parseTime(it.time);const done=(h*60+m)<nowM;const isNext=(next&&!tomorrow&&it===next);
    tl.appendChild(slotEl(day,it,done,isNext));
  });
  renderMini(now);
  window._heroNext={day,it:next,date:nextDate};
}
function renderHero(it,date,tomorrow,day){
  const h=document.getElementById('heroNext');
  if(!it){h.innerHTML='<div class="lbl">Rien de prévu</div>';return;}
  h.innerHTML=`
    <div class="lbl"><span class="dot" style="animation:none"></span>${tomorrow?'Prochain post — demain':'Prochain post'}</div>
    <div class="count" id="cd">—</div>
    <div class="when" id="cdWhen"></div>
    <div class="hero-body">
      <div class="hero-line">${chipHTML(it.typeKey)}<span class="mono" style="font-size:13px">${it.time}</span><span style="color:#CDC4D6">· ${esc(it.duree)}</span></div>
      <div class="hero-line"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.2-7-11a7 7 0 0114 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${esc(it.lieu)}</div>
      <div class="hero-scene">${esc(it.legende&&it.typeKey!=='story'?it.legende:it.note)}</div>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="openSheet('${day.date}','${it.time}')">Voir le détail</button>
        <button class="btn btn-ghost" onclick="copyText(window._heroNext.it.promptFinal,this,'prompt')">Copier le prompt</button>
      </div>
    </div>`;
  tickCountdown();
}
let cdTimer=null;
function tickCountdown(){
  clearInterval(cdTimer);
  const el=document.getElementById('cd'),w=document.getElementById('cdWhen');
  if(!el||!window._heroNext||!window._heroNext.date)return;
  function upd(){
    const now=new Date();let diff=Math.max(0,Math.floor((window._heroNext.date-now)/1000));
    const hh=Math.floor(diff/3600),mm=Math.floor(diff%3600/60),ss=diff%60;
    let txt;
    if(hh>0)txt=`${hh} h ${String(mm).padStart(2,'0')} <small>min</small>`;
    else if(mm>0)txt=`${mm} <small>min</small> ${String(ss).padStart(2,'0')} <small>s</small>`;
    else txt=`${ss} <small>s</small>`;
    el.innerHTML=diff<=0?'À poster <small>maintenant</small>':'dans '+txt;
    const d=window._heroNext.date;
    w.textContent=`prévu à ${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`;
  }
  upd();cdTimer=setInterval(upd,1000);
}
function slotEl(day,it,done,isNext){
  const b=document.createElement('button');b.className='slot'+(done?' done':'')+(isNext?' next':'');
  b.onclick=()=>openSheet(day.date,it.time);
  const cap=it.typeKey==='story'?(it.note||''):(it.legende||'');
  b.innerHTML=`<span class="time">${esc(it.time)}</span>
    <div class="mid"><div class="top">${chipHTML(it.typeKey)}<span class="lieu">${esc(it.lieu)}</span></div>
    <div class="cap">${esc(cap)}</div></div>
    <span class="chev">›</span>`;
  return b;
}
function renderMini(now){
  const el=document.getElementById('miniCal');const dim=DATA.daysInMonth,fw=DATA.firstWeekday;
  const todayN=(now.getFullYear()===DATA.year&&now.getMonth()===DATA.monthIndex)?now.getDate():-1;
  let h=`<div class="mini-head"><b>${DATA.month}</b><span style="font-size:12px;color:var(--muted)">${dim} jours</span></div><div class="mini-grid">`;
  ['L','M','M','J','V','S','D'].forEach(d=>h+=`<div class="dow">${d}</div>`);
  for(let i=0;i<fw;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){const day=DATA.days[d-1];const dots=dotStr(day);
    h+=`<div class="cell day${d===todayN?' today':''}" onclick="openDay(${d})"><span>${d}</span><div class="dots">${dots}</div></div>`;}
  h+='</div>';el.innerHTML=h;
}
function dotStr(day){const t=new Set(itemsOnly(day).map(i=>i.typeKey));let s='';
  if(t.has('story'))s+='<i class="s"></i>';if(t.has('post'))s+='<i class="p"></i>';if(t.has('reel'))s+='<i class="r"></i>';return s;}

/* ---- calendar ---- */
function renderCalendar(){
  const el=document.getElementById('calGrid');const dim=DATA.daysInMonth,fw=DATA.firstWeekday;
  const now=new Date();const todayN=(now.getFullYear()===DATA.year&&now.getMonth()===DATA.monthIndex)?now.getDate():-1;
  let h='';['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d=>h+=`<div class="dow">${d}</div>`);
  for(let i=0;i<fw;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){const day=DATA.days[d-1];
    h+=`<div class="cell day${d===todayN?' today':''}" onclick="openDay(${d})"><span class="num">${d}</span><div class="dots">${dotStr(day)}</div></div>`;}
  el.innerHTML=h;
}

/* ---- day view ---- */
function openDay(d){
  const day=DATA.days[d-1];if(!day)return;
  const dt=new Date(DATA.year,DATA.monthIndex,d);
  document.getElementById('dayHero').innerHTML=`<div class="dt">${JOURS[day.wd]} ${d} ${MOIS[DATA.monthIndex]}</div><h1>${esc(day.theme)}</h1>`;
  const parts=day.resume.split(/\.\s+/);
  document.getElementById('dayResume').innerHTML=`<span class="k">Résumé de la journée</span>${esc(day.resume)}`;
  const tl=document.getElementById('dayTl');tl.innerHTML='';
  itemsOnly(day).forEach(it=>tl.appendChild(slotEl(day,it,false,false)));
  go('day',true);
}

/* ---- detail sheet ---- */
function openSheet(date,time){
  const day=byDate[date];if(!day)return;const it=day.items.find(i=>i.time===time&&i.typeKey!=='resume');if(!it)return;
  document.getElementById('sheetHead').innerHTML=`${chipHTML(it.typeKey)}<span class="time">${esc(it.time)}</span>
    <span style="color:var(--muted);font-size:13px">· ${esc(it.duree)}</span>
    <button class="x" onclick="closeSheet()">✕</button>`;
  const lieuName=it.lieu.replace(/^[^ ]+ /,'');
  let h='';
  h+=`<div class="field"><div class="k">Lieu</div><div class="lieu-box"><b>${esc(it.lieu)}</b>${esc(it.lieuDetail)}</div></div>`;
  h+=`<div class="field"><div class="k">Prompt final — prêt pour Higgsfield</div>
      <div class="prompt-box" id="pf">${esc(it.promptFinal)}</div>
      <button class="copybtn" id="cpMain">${icoCopy()} Copier le prompt</button></div>`;
  if(it.legende&&it.typeKey!=='story'){
    h+=`<div class="field"><div class="k">Légende à publier <button class="mini-copy" data-cp="leg">${icoCopy()}Copier</button></div><div class="txt-box" id="leg">${esc(it.legende)}</div></div>`;
    h+=`<div class="field"><div class="k">Hashtags <button class="mini-copy" data-cp="tags">${icoCopy()}Copier</button></div><div class="txt-box hashtags" id="tags">${esc(it.hashtags)}</div></div>`;
  } else if(it.typeKey==='story'){
    h+=`<div class="field"><div class="k">Texte à afficher (sticker)</div><div class="txt-box">${esc(it.legende)}</div></div>`;
  }
  h+=`<div class="field"><span class="pref ${it.photoRef==='Recommandée'?'rec':'no'}">${icoCam()} Photo de réf. : ${esc(it.photoRef)}</span></div>`;
  h+=`<details><summary>Voir le prompt de base <span>▾</span></summary><div class="inner" style="font-size:12.5px;color:var(--ink-soft);white-space:pre-wrap">${esc(it.promptBase)}</div></details>`;
  h+=`<details><summary>Résumé de la journée <span>▾</span></summary><div class="inner" style="font-size:13px;color:var(--ink-soft)">${esc(day.resume)}</div></details>`;
  document.getElementById('sheetBody').innerHTML=h;
  document.getElementById('sheetBody').scrollTop=0;
  document.getElementById('cpMain').onclick=function(){copyText(it.promptFinal,this,'prompt-main');};
  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=e=>{e.stopPropagation();copyText(document.getElementById(b.dataset.cp).innerText,b,'mini');});
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('overlay').classList.remove('open');document.getElementById('sheet').classList.remove('open');}

/* ---- copy ---- */
function copyText(txt,btn,kind){
  const done=()=>{toast('Prompt copié ✓');if(btn){const o=btn.innerHTML;
      if(kind==='mini'){btn.classList.add('ok');btn.innerHTML=icoCheck()+'Copié';}
      else if(btn.classList.contains('copybtn')){btn.classList.add('ok');btn.innerHTML=icoCheck()+' Copié !';}
      else {const t=btn.textContent;btn.textContent='Copié ✓';setTimeout(()=>btn.textContent=t,1600);return;}
      setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=o;},1800);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done));}
  else fallback(txt,done);
}
function fallback(txt,cb){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}
let toastT;function toast(m){const t=document.getElementById('toast');t.innerHTML=icoCheck()+m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---- nav ---- */
function go(v,fromDay){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nav-'+(v==='day'?'calendar':v));if(nb)nb.classList.add('active');
  window.scrollTo(0,0);document.querySelector('main').scrollTop=0;
  if(v==='calendar')renderCalendar();
}
/* icons */
function icoCopy(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>';}
function icoCheck(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>';}
function icoCam(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>';}

renderDashboard();
setInterval(()=>{if(document.getElementById('view-dashboard').classList.contains('active'))renderDashboard();},60000);
</script>
