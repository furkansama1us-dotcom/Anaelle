<title>Studio — Planning de contenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F3EC;--ink:#2A2430;--ink-soft:#5A5262;--muted:#8A8290;--chrome:#2E2733;--chrome-2:#3C3345;--line:#E7E0D5;--card:#FFFFFF;--accent:#B5698A;--accent-d:#9A4F72;--sage:#7E8A6B;--story:#C56B7A;--story-bg:#F7E4E9;--post:#3E6DA3;--post-bg:#E1EBF6;--reel:#B8863B;--reel-bg:#F6ECD6;--shadow:0 8px 30px rgba(42,36,48,.10);--shadow-s:0 2px 10px rgba(42,36,48,.07);--r:18px;--r-s:12px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#EDE7DC;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;box-shadow:0 0 60px rgba(0,0,0,.12);display:flex;flex-direction:column}
@media(min-width:520px){body{padding:22px 0}.app{min-height:calc(100vh - 44px);border-radius:26px;overflow:hidden}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{margin:0;font-family:Fraunces,serif;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.mono{font-family:'Space Mono',monospace}
header{position:sticky;top:0;z-index:40;background:linear-gradient(160deg,var(--chrome),var(--chrome-2));color:#F3EEE7;padding:16px 20px 14px;padding-top:max(16px,env(safe-area-inset-top))}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(181,105,138,.55);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(181,105,138,.5)}70%{box-shadow:0 0 0 10px rgba(181,105,138,0)}100%{box-shadow:0 0 0 0 rgba(181,105,138,0)}}
.brand b{font-family:Fraunces;font-weight:600;font-size:18px;letter-spacing:.02em}
.brand span{font-size:11px;color:#B9AFC4;letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:-2px}
.today-chip{text-align:right;font-size:12px;color:#CFC6D8}
.today-chip b{display:block;font-family:'Space Mono',monospace;font-size:13px;color:#fff;letter-spacing:.02em}
main{flex:1;padding:20px 18px 96px}
.view{display:none;animation:fade .35s ease}.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 2px 10px}
.sec{margin-bottom:26px}
.hero{background:linear-gradient(155deg,#332B3C,#4A3F55);color:#F5F1EA;border-radius:var(--r);padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(181,105,138,.35),transparent 70%)}
.hero .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C9BFD4;display:flex;align-items:center;gap:8px}
.count{font-family:Fraunces;font-weight:600;font-size:44px;line-height:1;margin:8px 0 2px;letter-spacing:-.02em}
.count small{font-size:20px;color:#D9CFE0;font-weight:500}
.hero .when{font-family:'Space Mono',monospace;font-size:13px;color:#E7B9CE}
.hero-body{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.13)}
.hero-line{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:6px;color:#EDE7F0}
.hero-line .ic{opacity:.8;flex:none}
.hero-scene{font-size:13px;color:#CDC4D6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:10px;margin-top:16px}
.btn{border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;flex:1;box-shadow:0 6px 16px rgba(181,105,138,.35)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:rgba(255,255,255,.12);color:#F3EEE7;flex:1}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.chip.story{background:var(--story-bg);color:var(--story)}.chip.post{background:var(--post-bg);color:var(--post)}.chip.reel{background:var(--reel-bg);color:var(--reel)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.tl{display:flex;flex-direction:column;gap:10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:13px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:transform .12s,box-shadow .15s,border-color .15s}
.slot:hover{box-shadow:var(--shadow-s);border-color:#DED6C8;transform:translateY(-1px)}
.slot .time{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--ink);width:46px;flex:none}
.slot .mid{flex:1;min-width:0}
.slot .mid .top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.slot .mid .lieu{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .cap{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.done{opacity:.5}
.slot.next{border-color:var(--accent);box-shadow:0 0 0 2px rgba(181,105,138,.16)}
.slot .chev{color:var(--muted);flex:none}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-s)}
.mini-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mini-head b{font-family:Fraunces;font-size:16px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:10px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px;letter-spacing:.04em}
.cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--ink);position:relative;transition:background .15s}
.cell.day{cursor:pointer}.cell.day:hover{background:#F1EAdf}.cell.empty{visibility:hidden}
.cell.today{background:var(--accent);color:#fff;font-weight:700}.cell.today .dots i{background:#fff!important}
.dots{display:flex;gap:2px;height:5px}.dots i{width:4px;height:4px;border-radius:50%}
.dots .s{background:var(--story)}.dots .p{background:var(--post)}.dots .r{background:var(--reel)}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.cal-head h1{font-size:26px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:2px 2px 16px}
.legend span{font-size:11px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .cell{aspect-ratio:.9;border:1px solid var(--line);background:var(--card);border-radius:11px;justify-content:flex-start;padding-top:7px}
.cal-grid .cell.day:hover{border-color:var(--accent);background:#fff}
.cal-grid .cell.today{background:var(--accent);border-color:var(--accent)}
.cal-grid .cell .num{font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:14px}
.day-hero{margin-bottom:18px}
.day-hero .dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-d);font-weight:700}
.day-hero h1{font-size:28px;margin:4px 0 2px;text-transform:capitalize}
.day-hero .th{color:var(--ink-soft);font-size:14px}
.resume{background:linear-gradient(150deg,#F0E9DE,#F7F3EC);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:20px;font-size:13.5px;color:var(--ink-soft)}
.resume .k{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.overlay{position:fixed;inset:0;background:rgba(30,25,34,.5);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .28s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:480px;z-index:90;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);max-height:92vh;display:flex;flex-direction:column;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translateX(-50%) translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:#D8D0C4;margin:10px auto 4px}
.sheet-head{padding:6px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet-head .time{font-family:'Space Mono',monospace;font-weight:700;font-size:15px}
.sheet-head .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#EDE6DA;display:grid;place-items:center;color:var(--ink-soft)}
.sheet-body{overflow-y:auto;padding:16px 20px 30px;-webkit-overflow-scrolling:touch}
.field{margin-bottom:18px}
.field>.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:7px}

    else{const t=btn.textContent;btn.textContent='Copié ✓';setTimeout(()=>btn.textContent=t,1600);return;}
    setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=o;},1800);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done));}else fallback(txt,done);}
function fallback(txt,cb){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}
let toastT;function toast(m){const t=document.getElementById('toast');t.innerHTML=icoCheck()+m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
function go(v,fromDay){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));const nb=document.getElementById('nav-'+(v==='day'?'calendar':v));if(nb)nb.classList.add('active');
  window.scrollTo(0,0);document.querySelector('main').scrollTop=0;if(v==='calendar')renderCalendar();}
function icoCopy(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>';}
function icoCheck(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>';}
function icoCam(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>';}
function icoSpark(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>';}
function icoDl(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>';}
function backendReady(){return CONFIG.genEndpoint && /^https?:$/.test(location.protocol);}
function onGenerate(it){ genHiggsfield(it.promptFinal); }
async function generateBackend(it){
  const area=document.getElementById('genArea'); if(!area)return;
  area.innerHTML=`<div class="gen-loading"><span class="spin"></span>Génération en cours… (~20-40 s, ne ferme pas la fenêtre)</div>`;
  try{
    const aspect=it.typeKey==='post'?'4:5':'9:16';
    const r=await fetch(CONFIG.genEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:it.promptFinal,aspect_ratio:aspect,type:it.typeKey})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.url) throw new Error(d.error||('Erreur '+r.status));
    area.innerHTML=`<img class="gen-img" src="${d.url}" alt="Résultat de génération"><div class="gen-actions"><a class="dl" href="${d.url}" target="_blank" rel="noopener">${icoDl()} Télécharger</a><button class="regen" onclick="onGenerate(window._cur)">↻ Régénérer</button></div>`;
    toast('Image générée ✓');
  }catch(e){
    area.innerHTML=`<div class="gen-err">Génération auto indisponible (${esc(String(e.message))}). Je copie le prompt et j\u2019ouvre Higgsfield.</div>`;
    genHiggsfield(it.promptFinal);
  }
}
function genHiggsfield(txt){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(function(){try{fallback(txt,function(){});}catch(e){}}); } else { fallback(txt,function(){}); } }catch(e){}
  var a=document.createElement('a'); a.href='https://higgsfield.ai/generate/image'; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); setTimeout(function(){ if(a&&a.parentNode) a.parentNode.removeChild(a); },150);
  toast('Prompt copié — génère sur ordinateur (illimité)');
}
renderDashboard();
setInterval(()=>{if(document.getElementById('view-dashboard').classList.contains('active'))renderDashboard();},60000);
</script></body></html>
